<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URL Auditor</title>
<style>
  :root {
    --ink: #16201c;
    --paper: #eef1ea;
    --panel: #ffffff;
    --line: #cdd4c6;
    --moss: #3c5a44;
    --moss-dim: #6c8172;
    --flag: #b6501f;
    --flag-bg: #fbe9de;
    --ok-bg: #e4ede2;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  main {
    flex: 1;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 64px 24px 40px;
  }

  header.masthead {
    margin-bottom: 40px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--moss);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eyebrow::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--moss);
    display: inline-block;
    border-radius: 50%;
  }

  h1 {
    font-size: 40px;
    line-height: 1.05;
    margin: 10px 0 6px;
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  .sub {
    color: var(--moss-dim);
    font-size: 15px;
    max-width: 46ch;
  }

  form {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }

  input[type="text"] {
    flex: 1;
    font-family: var(--mono);
    font-size: 15px;
    padding: 14px 16px;
    border: 2px solid var(--ink);
    background: var(--panel);
    color: var(--ink);
    outline: none;
  }

  input[type="text"]:focus {
    box-shadow: 3px 3px 0 var(--moss);
  }

  input[type="text"]::placeholder { color: #9aa596; }

  button {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 14px 22px;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    cursor: pointer;
    transition: transform 0.08s ease;
  }

  button:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--moss); }
  button:active:not(:disabled) { transform: translate(0, 0); box-shadow: none; }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  #status {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--moss-dim);
    min-height: 18px;
    margin-bottom: 10px;
  }

  .error-box {
    border: 2px solid var(--flag);
    background: var(--flag-bg);
    color: var(--flag);
    font-family: var(--mono);
    font-size: 14px;
    padding: 16px 18px;
    margin-top: 8px;
  }

  .error-box strong { display: block; margin-bottom: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 0.06em; }

  #report { margin-top: 12px; }

  .report-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .report-url {
    font-family: var(--mono);
    font-size: 13px;
    word-break: break-all;
    color: var(--moss);
  }

  .status-pill {
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 10px;
    border: 1.5px solid var(--ink);
    white-space: nowrap;
  }

  .status-pill.ok { background: var(--ok-bg); border-color: var(--moss); color: var(--moss); }
  .status-pill.warn { background: var(--flag-bg); border-color: var(--flag); color: var(--flag); }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 22px;
  }

  .cell {
    background: var(--panel);
    padding: 16px 14px;
  }

  .cell .label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--moss-dim);
    margin-bottom: 6px;
  }

  .cell .value {
    font-size: 22px;
    font-weight: 700;
    font-family: var(--mono);
  }

  .cell .value.flag { color: var(--flag); }
  .cell .value.good { color: var(--moss); }

  .field {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .field:last-child { border-bottom: none; }

  .field .label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--moss-dim);
    margin-bottom: 4px;
  }

  .field .value {
    font-size: 15px;
    line-height: 1.5;
  }

  .missing { color: var(--moss-dim); font-style: italic; }

  footer {
    text-align: center;
    padding: 22px 24px 30px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--moss-dim);
    border-top: 1px solid var(--line);
  }

  footer a { color: var(--moss); text-decoration: none; border-bottom: 1px dotted var(--moss); }
  footer a:hover { color: var(--ink); border-color: var(--ink); }

  @media (max-width: 520px) {
    h1 { font-size: 30px; }
    form { flex-direction: column; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="eyebrow">Page inspection tool</div>
    <h1>URL Auditor</h1>
    <p class="sub">Drop in any page. Get its status, load time, and a quick read on titles, headings, alt text, and word count.</p>
  </header>

  <form id="audit-form" autocomplete="off">
    <input
      type="text"
      id="url-input"
      name="url"
      placeholder="example.com or https://example.com/page"
      aria-label="URL to audit"
      required
    />
    <button type="submit" id="submit-btn">Audit</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="output"></div>
</main>

<footer>
  Built for Digital Heroes Training Task —
  <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer">digitalheroesco.com</a>
</footer>

<script>
  const form = document.getElementById('audit-form');
  const input = document.getElementById('url-input');
  const button = document.getElementById('submit-btn');
  const statusEl = document.getElementById('status');
  const output = document.getElementById('output');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderError(message) {
    output.innerHTML = `
      <div class="error-box">
        <strong>Audit failed</strong>
        ${escapeHtml(message)}
      </div>
    `;
  }

  function renderReport(data) {
    const statusClass = data.httpStatus >= 200 && data.httpStatus < 400 ? 'ok' : 'warn';
    const altFlag = data.imagesMissingAlt > 0;
    const h1Flag = data.h1Count !== 1;

    output.innerHTML = `
      <div id="report">
        <div class="report-head">
          <span class="report-url">${escapeHtml(data.finalUrl || data.requestedUrl)}</span>
          <span class="status-pill ${statusClass}">HTTP ${data.httpStatus} · ${data.responseTimeMs} ms</span>
        </div>

        <div class="grid">
          <div class="cell">
            <div class="label">H1 tags</div>
            <div class="value ${h1Flag ? 'flag' : 'good'}">${data.h1Count}</div>
          </div>
          <div class="cell">
            <div class="label">Images missing alt</div>
            <div class="value ${altFlag ? 'flag' : 'good'}">${data.imagesMissingAlt} / ${data.imageCount}</div>
          </div>
          <div class="cell">
            <div class="label">Word count (approx.)</div>
            <div class="value">${data.wordCount.toLocaleString()}</div>
          </div>
        </div>

        <div class="field">
          <div class="label">Page title</div>
          <div class="value">${data.title ? escapeHtml(data.title) : '<span class="missing">No &lt;title&gt; found</span>'}</div>
        </div>
        <div class="field">
          <div class="label">Meta description</div>
          <div class="value">${data.metaDescription ? escapeHtml(data.metaDescription) : '<span class="missing">No meta description found</span>'}</div>
        </div>
      </div>
    `;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = input.value.trim();
    if (!url) return;

    button.disabled = true;
    statusEl.textContent = 'Fetching and analyzing page…';
    output.innerHTML = '';

    try {
      const res = await fetch('/api/audit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });

      let data;
      try {
        data = await res.json();
      } catch {
        renderError('The server returned an unreadable response.');
        return;
      }

      if (!res.ok) {
        renderError(data?.error?.message || 'Unknown error.');
        return;
      }

      renderReport(data);
    } catch (err) {
      renderError('Could not reach the audit server. Check your connection and try again.');
    } finally {
      button.disabled = false;
      statusEl.textContent = '';
    }
  });
</script>
</body>
</html>
